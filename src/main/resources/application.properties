server.port=${PORT:8080}

spring.datasource.url=jdbc:${MYSQL_PUBLIC_URL}
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

app.cors.allowed-origins=https://student-portfolio-production.up.railway.app,https://fsad-student-portfolio.vercel.app,https://student-portfolio-sooty.vercel.app,http://localhost:5173
